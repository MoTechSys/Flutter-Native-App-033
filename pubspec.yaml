publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  shared_preferences: 2.5.3
  http: 1.5.0
  crypto: ^3.0.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/covers/
    - assets/brand/
